# گام ۳۳/۳۶ — مرحلهٔ ۲: HTTPS + ریدایرکت کانونیکال + HSTS + noindex پنل
# deploy.sh بعد از صدور گواهی نصبش می‌کند؛ `__CERT_DIR__` جایگزین مسیر letsencrypt می‌شود.
# کانونیکال: https://www.lebaszirghasedak.ir — apex با ۳۰۱ دائمی به www (گام ۲۰/تصمیم #۴).

map $http_upgrade $ghasedak_upgrade {
    default upgrade;
    ''      close;
}

# نسخهٔ nginx از سربرگ پاسخ حذف می‌شود (hardening — گام ۳۶)
server_tokens off;

# --- HTTP: ACME باقی می‌ماند، بقیه ۳۰۱ به HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name lebaszirghasedak.ir www.lebaszirghasedak.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.lebaszirghasedak.ir$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.lebaszirghasedak.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://admin.lebaszirghasedak.ir$request_uri;
    }
}

# --- apex روی ۴۴۳: فقط ریدایرکت ۳۰۱ (هیچ صفحه‌ای روی apex ایندکس نمی‌شود — گام ۲۰) ---
server {
    # nginx 1.24 (Ubuntu 24.04): http2 فقط با پیشوند listen فعال می‌شود؛
    # `http2 on;` از 1.25.1 به بعد معتبر است — این شکل روی هر دو کار می‌کند.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lebaszirghasedak.ir;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        return 301 https://www.lebaszirghasedak.ir$request_uri;
    }
}

# --- فروشگاه (کانونیکال) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lebaszirghasedak.ir;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 32m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ghasedak_upgrade;
        proxy_read_timeout 120s;   # SSE چت‌بات
    }
}

# --- پنل ادمین (noindex) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.lebaszirghasedak.ir;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 32m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ghasedak_upgrade;
        proxy_read_timeout 120s;
    }
}
