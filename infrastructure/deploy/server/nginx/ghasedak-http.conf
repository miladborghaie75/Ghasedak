# گام ۳۳ — مرحلهٔ ۱: فقط HTTP (پروکسی + مسیر ACME)
# deploy.sh قبل از صدور گواهی نصبش می‌کند؛ پس از certbot با ghasedak-ssl.conf جایگزین می‌شود.
# نکته: `return` در سطح server جلوی تطبیق location را می‌گیرد، پس ریدایرکت apex
# باید داخل `location /` باشد تا `/.well-known/acme-challenge/` کار کند.

map $http_upgrade $ghasedak_upgrade {
    default upgrade;
    ''      close;
}

# نسخهٔ nginx از سربرگ پاسخ حذف می‌شود (hardening — گام ۳۶)
server_tokens off;

# فروشگاه — www و apex با هم (فقط تا پیش از SSL؛ ریدایرکت ۳۰۱ واقعی در مرحلهٔ ۲)
server {
    listen 80;
    listen [::]:80;
    server_name lebaszirghasedak.ir www.lebaszirghasedak.ir;

    client_max_body_size 32m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ghasedak_upgrade;
        proxy_read_timeout 120s;   # SSE چت‌بات (گام ۱۸-۳)
    }
}

# پنل ادمین — ساب‌دامین جدا، همیشه noindex
server {
    listen 80;
    listen [::]:80;
    server_name admin.lebaszirghasedak.ir;

    client_max_body_size 32m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ghasedak_upgrade;
        proxy_read_timeout 120s;
    }
}
